<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Quiniela Mundial 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4002B"/>
      <stop offset="1" stop-color="#A60020"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DE8B"/>
      <stop offset="0.45" stop-color="#E3BE55"/>
      <stop offset="1" stop-color="#B6852A"/>
    </linearGradient>
    <linearGradient id="oroBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B441"/>
      <stop offset="1" stop-color="#9C6F22"/>
    </linearGradient>
  </defs>

  <!-- Fondo a sangre completa: el sistema recorta los bordes (círculo/squircle). -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Trofeo dentro de la zona segura (centro ~80%) para íconos maskable. -->
  <g transform="translate(139,80) scale(1.95)">
    <circle cx="60" cy="36" r="26" fill="url(#oro)" stroke="#8C6618" stroke-width="2"/>
    <g fill="none" stroke="#8C6618" stroke-width="1.6" opacity="0.85">
      <ellipse cx="60" cy="36" rx="26" ry="10"/>
      <ellipse cx="60" cy="36" rx="10" ry="26"/>
      <line x1="34" y1="36" x2="86" y2="36"/>
    </g>
    <path d="M48 60
             C 30 78, 34 104, 52 122
             L 68 122
             C 86 104, 90 78, 72 60
             C 70 74, 50 74, 48 60 Z"
          fill="url(#oro)" stroke="#8C6618" stroke-width="2" stroke-linejoin="round"/>
    <path d="M50 60 Q60 70 70 60" fill="none" stroke="#8C6618" stroke-width="1.6" opacity="0.7"/>
    <rect x="50" y="122" width="20" height="10" fill="url(#oroBase)" stroke="#8C6618" stroke-width="1.5"/>
    <rect x="36" y="132" width="48" height="16" rx="3" fill="url(#oroBase)" stroke="#8C6618" stroke-width="2"/>
    <rect x="40" y="150" width="40" height="8" rx="2" fill="#8C6618"/>
  </g>
</svg>
